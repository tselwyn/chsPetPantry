# Local test databases matching dev (MariaDB 10.4, like XAMPP) and production (MySQL / Percona 8.4).
# Development only: empty root passwords, bound to 127.0.0.1.
#
#   docker compose -f tools/docker-compose.db.yml up -d
#   php bin/migrate.php --config=<a config pointing at port 3310, 3384 or 3385>
services:
  mariadb104:
    image: mariadb:10.4
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
    ports:
      - "127.0.0.1:3310:3306"
  mysql84:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "127.0.0.1:3384:3306"
  percona84:
    image: percona/percona-server:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "127.0.0.1:3385:3306"
